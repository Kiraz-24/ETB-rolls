<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolls-Royce TotalCare IoT Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { text-align: center; margin-bottom: 30px; }
        
        /* Controls Section */
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 40px; align-items: center; justify-content: center;}
        .slider-container { display: flex; flex-direction: column; width: 300px; }
        input[type=range] { width: 100%; margin-top: 10px; }
        
        /* KPI Cards */
        .kpi-row { display: flex; gap: 20px; margin-bottom: 20px; justify-content: space-between;}
        .kpi-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .kpi-card h3 { margin: 0; font-size: 14px; color: #666; text-transform: uppercase;}
        .kpi-value { font-size: 28px; font-weight: bold; color: #003366; margin-top: 10px; }
        
        /* Charts */
        .chart-row { display: flex; gap: 20px; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 50%; }
        canvas { width: 100% !important; height: 300px !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Rolls-Royce "TotalCare" Business Analytics</h2>
        <p>Adjust the IoT Implementation level to see the impact on revenue and maintenance costs.</p>
    </div>

    <!-- Interactive Controls -->
    <div class="controls">
        <div class="slider-container">
            <label for="iotSlider"><strong>IoT Implementation Level: <span id="iotValue">0</span>%</strong></label>
            <input type="range" id="iotSlider" min="0" max="100" value="0">
        </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-row">
        <div class="kpi-card">
            <h3>Overall Fleet Uptime</h3>
            <div class="kpi-value" id="kpiUptime">85.0%</div>
        </div>
        <div class="kpi-card">
            <h3>Unplanned Downtime (Hrs)</h3>
            <div class="kpi-value" id="kpiDowntime">50,000</div>
        </div>
        <div class="kpi-card">
            <h3>Service Revenue Mix</h3>
            <div class="kpi-value" id="kpiMix">20.0%</div>
        </div>
        <div class="kpi-card">
            <h3>Total Maintenance Cost</h3>
            <div class="kpi-value" id="kpiCost">$120.0M</div>
        </div>
    </div>

    <!-- Charts -->
    <div class="chart-row">
        <div class="chart-container">
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="costChart"></canvas>
        </div>
    </div>
</div>

<script>
    // --- 1. Base Data Generation (60 months) ---
    const labels = Array.from({length: 60}, (_, i) => `Month ${i+1}`);
    const baseHardwareRev = Array.from({length: 60}, () => 500); // Flat baseline
    const baseServiceRev = Array.from({length: 60}, () => 100); 
    const baseMaintCost = Array.from({length: 60}, () => 80); 
    const baseDowntime = 50000;

    // --- 2. Initialize Charts ---
    const revCtx = document.getElementById('revenueChart').getContext('2d');
    const costCtx = document.getElementById('costChart').getContext('2d');

    let revenueChart = new Chart(revCtx, {
        type: 'line',
        data: { labels: labels, datasets: [
            { label: 'Hardware Revenue ($M)', data: baseHardwareRev, borderColor: '#ccc', fill: true, backgroundColor: 'rgba(204, 204, 204, 0.2)' },
            { label: 'Service Revenue ($M)', data: baseServiceRev, borderColor: '#003366', fill: true, backgroundColor: 'rgba(0, 51, 102, 0.4)' }
        ]},
        options: { responsive: true, plugins: { title: { display: true, text: 'Revenue Mix Shift' } }, interaction: { mode: 'index', intersect: false } }
    });

    let costChart = new Chart(costCtx, {
        type: 'bar',
        data: { labels: labels, datasets: [
            { label: 'Maintenance Cost ($M)', data: baseMaintCost, backgroundColor: '#d9534f' }
        ]},
        options: { responsive: true, plugins: { title: { display: true, text: 'Total Maintenance Costs' } } }
    });

    // --- 3. Dynamic Update Logic ---
    const iotSlider = document.getElementById('iotSlider');
    const iotValueDisplay = document.getElementById('iotValue');

    function updateSimulation() {
        const iotRatio = parseInt(iotSlider.value) / 100;
        iotValueDisplay.innerText = iotSlider.value;

        let newHardware = [];
        let newService = [];
        let newCost = [];
        
        let totalHardwareSum = 0;
        let totalServiceSum = 0;
        let finalCostSum = 0;

        // Calculate trends across the 60 months based on IoT injection
        for (let i = 0; i < 60; i++) {
            // Time factor (effects compound over time)
            let timeFactor = i / 60; 

            // Service rev goes up as IoT goes up. Hardware slowly dips.
            let hRev = 500 - (150 * iotRatio * timeFactor); 
            let sRev = 100 + (600 * iotRatio * timeFactor);
            
            // Costs drop as IoT allows predictive maintenance
            let cost = 80 - (50 * iotRatio * timeFactor);

            newHardware.push(hRev);
            newService.push(sRev);
            newCost.push(cost);

            // Tally for KPIs (taking the average of the last year / final state for impact)
            if(i >= 48) {
                totalHardwareSum += hRev;
                totalServiceSum += sRev;
                finalCostSum += cost;
            }
        }

        // Update Charts
        revenueChart.data.datasets[0].data = newHardware;
        revenueChart.data.datasets[1].data = newService;
        revenueChart.update();

        costChart.data.datasets[0].data = newCost;
        // Turn bar green if costs drop significantly
        costChart.data.datasets[0].backgroundColor = iotRatio > 0.5 ? '#5cb85c' : '#d9534f'; 
        costChart.update();

        // Update KPIs based on the final 12-month average run rate
        let avgH = totalHardwareSum / 12;
        let avgS = totalServiceSum / 12;
        let mix = (avgS / (avgH + avgS)) * 100;
        
        let newDowntime = baseDowntime - (baseDowntime * 0.85 * iotRatio); // 85% reduction max
        let uptime = 85.0 + (14.9 * iotRatio); // Goes from 85% to 99.9%
        
        document.getElementById('kpiUptime').innerText = uptime.toFixed(1) + "%";
        document.getElementById('kpiDowntime').innerText = newDowntime.toLocaleString('en-US', {maximumFractionDigits: 0});
        document.getElementById('kpiMix').innerText = mix.toFixed(1) + "%";
        document.getElementById('kpiCost').innerText = "$" + (finalCostSum).toFixed(1) + "M"; // Annualized
    }

    // --- 4. Event Listeners ---
    iotSlider.addEventListener('input', updateSimulation);
    
    // Initial Render
    updateSimulation();
</script>
</body>
</html>
